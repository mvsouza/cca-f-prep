<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#d97706" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Outer Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Top Pill / Category -->
  <g transform="translate(80, 80)">
    <rect width="360" height="42" rx="21" fill="rgba(217, 119, 6, 0.15)" stroke="rgba(217, 119, 6, 0.4)" stroke-width="1.5" />
    <text x="180" y="27" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle">OFFICIAL BLUEPRINT ALIGNED</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Anthropic Claude Certified Architect
  </text>
  <text x="80" y="260" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    Foundations (CCA-F / CCAR-F) Exam Simulator
  </text>

  <!-- Subheadline -->
  <text x="80" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    700+ High-Yield Scenario Questions • Spaced-Repetition Mastery • 100% Free &amp; Client-Side
  </text>

  <!-- Feature Grid Badges -->
  <g transform="translate(80, 385)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="110" rx="16" fill="url(#badge-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
      <text x="24" y="44" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">QUESTION BANK</text>
      <text x="24" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">701 Qs</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(255, 0)">
      <rect width="235" height="110" rx="16" fill="url(#badge-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
      <text x="24" y="44" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">PASS BENCHMARK</text>
      <text x="24" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">720/1000</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(510, 0)">
      <rect width="235" height="110" rx="16" fill="url(#badge-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
      <text x="24" y="44" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">STUDY TIMELINE</text>
      <text x="24" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">14 Days</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(765, 0)">
      <rect width="275" height="110" rx="16" fill="url(#badge-bg)" stroke="rgba(217,119,6,0.3)" stroke-width="1.5" />
      <text x="24" y="44" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">SPONSORED VOUCHER</text>
      <text x="24" y="85" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">$0 via CPN</text>
    </g>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="80" y="555" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    Open Source Community Resource • mvsouza.github.io/cca-f-prep • By Matheus Souza
  </text>
</svg>
